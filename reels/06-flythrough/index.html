<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Reel 6</title>
<link rel="stylesheet" href="../shared.css">
<style>
:root{--paper:#F5F5F5;--ink:#0B0B0B}
body,#stage{background:var(--ink)}
.scene{position:absolute;inset:0;visibility:hidden;perspective:1500px;perspective-origin:50% 50%;overflow:hidden}
.scene.l{background:var(--paper);color:var(--ink)} .scene.d{background:var(--ink);color:#fff}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.it{position:absolute;will-change:transform}
.cut{border-radius:28px;overflow:hidden;background:#fff}
.d .cut{box-shadow:0 0 0 2px rgba(255,255,255,.08),0 50px 90px rgba(0,0,0,.65)}
.l .cut{box-shadow:0 0 0 2px rgba(11,11,11,.05),0 40px 80px rgba(11,11,11,.22)}
.cut img,.png img{display:block;width:100%}
.png img{filter:drop-shadow(0 40px 50px rgba(11,11,11,.28))}
.d .png img{filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))}
.phone{background:#0B0B0B;padding:12px;border-radius:64px;box-shadow:0 50px 90px rgba(0,0,0,.35)}
.d .phone{background:#1c1c1c;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 50px 90px rgba(0,0,0,.65)}
.phone .in{border-radius:52px;overflow:hidden;position:relative;width:100%;height:100%;background:#fff}
.win .in{overflow:hidden;position:relative;width:100%;height:100%}
.txt{white-space:nowrap;text-align:center;letter-spacing:-.05em;line-height:1;font-size:300px;text-transform:uppercase}
.txt.dim{color:#1d1d1d}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:20px 44px 22px;font-size:54px;letter-spacing:-.03em;line-height:1}
.d .pill{background:#fff;color:var(--ink)} .l .pill{background:var(--ink);color:#fff}
.pill.g{background:var(--green)!important;color:var(--ink)!important}
.cap{position:absolute;left:0;right:0;text-align:center}
.mask{overflow:hidden;display:block;padding:.08em 0}.mask>span{display:block}
.big{font-size:150px;letter-spacing:-.05em;line-height:.95}
</style></head><body><div id="stage">
<div class="scene l" id="S1"><div class="world" id="w1"></div></div>
<div class="scene d" id="S2"><div class="world" id="w2"></div></div>
<div class="scene l" id="S3"><div class="world" id="w3"></div></div>
<div class="scene d" id="S4"><div class="world" id="w4"></div>
  <div class="cap" style="top:700px"><div id="lg" style="display:flex;justify-content:center"></div></div>
  <div class="cap" style="top:960px"><div class="big mask"><span id="nm">Swipex</span></div></div>
</div></div>
<script src="../vendor/gsap.min.js"></script><script src="../logo.js"></script>
<script>
document.getElementById('lg').innerHTML=logoSVG(220,false);
const NS={team:[1080,1920],bulb:[699,808],arrow:[613,703],qmark:[745,833],'wp-profile':[370,350],'wp-comp':[370,235],'wp-news':[370,360],'medis-title':[760,130],'medis-price':[380,320],'medis-list':[690,360],'medis-video':[690,410],'vohen-card':[492,160],'vohen-menu':[240,580],'vohen-mobile':[390,844],'vohen-modal':[392,845],'vohen-desktop':[1440,1024]};
const P=(...a)=>a;
function it(wid,o){const w=document.getElementById(wid),el=document.createElement('div');el.className='it';
  const cx=540+o.x, cy=960+o.y; let width=o.w,height;
  if(o.txt!==undefined){el.className+=' txt'+(o.dim?' dim':'');el.innerHTML=o.txt;el.style.cssText+=`left:0;width:1080px;top:${cy-150}px;font-size:${o.fs||300}px`;if(o.col)el.style.color=o.col;}
  else if(o.pill){el.innerHTML=`<span class="pill${o.g?' g':''}" style="${o.fs?'font-size:'+o.fs+'px':''}">${o.pill}</span>`;el.style.cssText+=`left:${cx}px;top:${cy}px;`;el.dataset.c=1;}
  else{
    if(o.kind==='png'){const [iw,ih]=NS[o.img];height=width*ih/iw;el.className+=' png';el.innerHTML=`<img src="../assets/${o.img}.png">`;}
    else if(o.kind==='phone'){height=o.h;el.className+=' cut phone';el.innerHTML=`<div class="in"><img src="../assets/${o.img}.png" style="width:100%"></div>`;}
    else if(o.kind==='win'){height=o.h;el.className+=' cut win';el.innerHTML=`<div class="in"><img src="../assets/${o.img}.png" style="width:100%"></div>`;}
    else{const [iw,ih]=NS[o.img];height=width*ih/iw;el.className+=' cut';el.innerHTML=`<img src="../assets/${o.img}.png">`;if(o.round)el.style.borderRadius=o.round+'px';}
    el.style.cssText+=`left:${cx-width/2}px;top:${cy-height/2}px;width:${width}px;height:${height}px;`;
  }
  w.appendChild(el);
  gsap.set(el,{z:o.z||0,rotation:o.rot||0,xPercent:o.pill?-50:0,yPercent:o.pill?-50:0});
  return el;}

const tl=gsap.timeline({paused:true,defaults:{ease:'power4.out'}});
const show=(sel,a,b)=>{tl.set(sel,{visibility:'visible'},a);if(b!=null)tl.set(sel,{visibility:'hidden'},b)};
const enter=(els,at,st=.07)=>tl.fromTo(els,{y:'+=360',opacity:0},{y:'-=360',opacity:1,duration:1,stagger:st,ease:'power4.out'},at);
const floatAll=(els,at,d)=>els.forEach((e,i)=>tl.to(e,{y:(i%2?'+=':'-=')+(10+i*2),duration:d,ease:'sine.inOut'},at));
const cam=(wid,at,d,from,to,ease='power1.inOut')=>tl.fromTo('#'+wid,from,Object.assign({duration:d,ease},to),at);

/* ===== S1 white: team, bulb, question — 0 → 4.4 ===== */
const S1=0,E1=4.4; show('#S1',S1,E1);
const t1=it('w1',{txt:'Є <span style="color:#0ABB87">ідея?</span>',x:0,y:-120,z:-520,fs:340});
const team=it('w1',{img:'team',x:0,y:80,z:-80,w:540,round:36});
const bulb=it('w1',{kind:'png',img:'bulb',x:-300,y:-360,z:230,w:360,rot:-8});
const qm=it('w1',{kind:'png',img:'qmark',x:330,y:-330,z:40,w:270,rot:10});
const c1=it('w1',{img:'wp-comp',x:-250,y:560,z:140,w:400,rot:-6});
const c2=it('w1',{img:'medis-price',x:290,y:500,z:290,w:340,rot:5});
const c3=it('w1',{img:'vohen-card',x:300,y:-10,z:170,w:420,rot:4});
const L1=[team,bulb,qm,c1,c3,c2];
tl.fromTo(t1,{opacity:0,scale:.8},{opacity:1,scale:1,duration:.9},.05);
enter(L1,.15,.1);
cam('w1',S1,E1-.1,{z:-520,rotationY:16,x:140,y:30},{z:430,rotationY:-5,x:-40,y:-10},'power2.inOut');
floatAll(L1,.9,2.2);

/* ===== S2 black: projects — 4.4 → 8.9 ===== */
const S2=4.4,E2=8.9; show('#S2',S2,E2);
const t2=it('w2',{txt:'Наші<br>проєкти',x:0,y:-80,z:-620,fs:300,dim:1}); t2.style.lineHeight='.95'; t2.style.top='700px';
const v1=it('w2',{kind:'win',img:'vohen-desktop',x:250,y:-390,z:-300,w:640,h:455,rot:-3});
const m1=it('w2',{kind:'win',img:'medis-desktop',x:-40,y:-40,z:-130,w:780,h:545,rot:2});
const ph=it('w2',{kind:'phone',img:'wp-long',x:310,y:250,z:90,w:300,h:640,rot:4});
const vm=it('w2',{kind:'phone',img:'vohen-mobile',x:-300,y:300,z:210,w:280,h:606,rot:-5});
const vmo=it('w2',{img:'vohen-modal',x:-340,y:-330,z:30,w:230,rot:-7});
const ml=it('w2',{img:'medis-list',x:60,y:570,z:250,w:420,rot:3});
const p1=it('w2',{pill:'Waterpolo',x:330,y:-60,z:110,fs:46});
const p2=it('w2',{pill:'Medis',x:-300,y:-190,z:-100,fs:46});
const p3=it('w2',{pill:'Вогень',x:230,y:-640,z:-280,fs:46});
const L2=[v1,m1,vmo,ph,vm,ml,p1,p2,p3];
tl.fromTo(t2,{opacity:0},{opacity:1,duration:.8},S2+.05);
enter(L2,S2+.1,.08);
// scrolling inside the windows
tl.fromTo(m1.querySelector('img'),{y:0},{y:-(3384*780/1440-545)*.5,duration:3.8,ease:'power1.inOut'},S2+.4);
tl.fromTo(ph.querySelector('img'),{y:0},{y:-(2402*276/390-616)*.6,duration:3.8,ease:'power1.inOut'},S2+.4);
cam('w2',S2,E2-S2-.1,{z:-420,rotationY:-14,x:-110,y:20},{z:300,rotationY:8,x:70,y:-20},'power2.inOut');
floatAll([m1,ph,vm,vmo,ml,v1],S2+.9,2.2);

/* ===== S3 white: steps — 8.9 → 12.7 ===== */
const S3=8.9,E3=12.7; show('#S3',S3,E3);
const ar=it('w3',{kind:'png',img:'arrow',x:30,y:-30,z:-420,w:620,rot:0});
const s1=it('w3',{pill:'Ідея',x:-290,y:-400,z:-300,fs:76});
const s2=it('w3',{pill:'Дизайн',x:270,y:-170,z:-120,fs:76});
const s3=it('w3',{pill:'Розробка',x:-250,y:110,z:60,fs:76});
const s4=it('w3',{pill:'Запуск',x:250,y:380,z:240,fs:76,g:1});
const u1=it('w3',{img:'medis-title',x:-40,y:-560,z:-380,w:520,rot:-3});
const u2=it('w3',{img:'wp-news',x:300,y:-390,z:-200,w:330,rot:6});
const u3=it('w3',{img:'vohen-modal',x:-340,y:260,z:-20,w:230,rot:-6});
const u4=it('w3',{img:'wp-profile',x:280,y:640,z:150,w:360,rot:5});
const u5=it('w3',{img:'medis-list',x:-210,y:640,z:260,w:430,rot:-4});
const L3=[u1,s1,u2,s2,u3,s3,u4,s4,u5];
tl.fromTo(ar,{opacity:0,scale:.7,rotation:-25},{opacity:1,scale:1,rotation:0,duration:1.1},S3+.05);
enter(L3,S3+.15,.11);
cam('w3',S3,E3-S3-.1,{z:-420,rotationY:12,x:100,y:-80},{z:380,rotationY:-8,x:-60,y:70},'power2.inOut');
tl.to(ar,{rotation:8,duration:3.2,ease:'sine.inOut'},S3+.9);
floatAll([u1,u2,u3,u4,u5],S3+1,2.2);

/* ===== S4 black: logo + name only — 12.7 → 15.9 ===== */
const S4=12.7; show('#S4',S4);
tl.fromTo('#lg svg',{scale:0,rotate:-140,opacity:0},{scale:1,rotate:0,opacity:1,duration:1.0,ease:'back.out(1.8)'},S4+.1);
tl.fromTo('#nm',{yPercent:115},{yPercent:0,duration:.8},S4+.55);
tl.to({},{duration:.01},S4+3.2);
window.TL=tl;
</script></body></html>
