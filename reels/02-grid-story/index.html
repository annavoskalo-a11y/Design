<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Reel 2</title>
<link rel="stylesheet" href="../shared.css">
<style>
body,#stage{background:var(--green)}
#grid{position:absolute;inset:0}
.cell{position:absolute;width:360px;height:384px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--dark);font-size:56px;line-height:1.08;letter-spacing:-.02em;text-transform:uppercase;overflow:hidden}
.cell .t{display:block;padding:0 20px}
.ln{position:absolute;background:var(--dark)}
.h{left:0;height:5px;width:1080px;transform:scaleX(0);transform-origin:left}
.v{top:0;width:5px;height:1920px;transform:scaleY(0);transform-origin:top}
#tile{position:absolute;left:-380px;top:768px;width:360px;height:384px;background:var(--dark);border-radius:56px;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.35);z-index:5}
.mask{overflow:hidden;display:block;padding:.08em 0}
.big{font-size:130px;line-height:1}
.sm{font-size:30px;font-weight:600;letter-spacing:.02em;text-transform:none}
.mail{font-size:36px;text-transform:none;letter-spacing:0}
.pj .t{font-size:42px}
.dk{background:var(--dark);color:var(--green)}
</style></head><body><div id="stage"><div id="grid"></div><div id="tile"></div></div>
<script src="../vendor/gsap.min.js"></script><script src="../logo.js"></script>
<script>
const G=document.getElementById('grid');
// lines
for(let i=1;i<5;i++){G.insertAdjacentHTML('beforeend',`<div class="ln h" style="top:${i*384-2}px"></div>`)}
for(let i=1;i<3;i++){G.insertAdjacentHTML('beforeend',`<div class="ln v" style="left:${i*360-2}px"></div>`)}
const cell=(r,c,html,id,cls='')=>G.insertAdjacentHTML('beforeend',`<div class="cell ${cls}" id="${id}" style="left:${c*360}px;top:${r*384}px"><span class="mask"><span class="t">${html}</span></span></div>`);
// row2 (index1): headline
cell(1,0,'Веб-','a1');cell(1,1,'та мобільна','a2');cell(1,2,'розробка','a3');
// row3 (index2): logo x project
cell(2,0,'','b1','dk');cell(2,1,'<span class="big">×</span>','b2');cell(2,2,'Waterpolo','b3','pj');
// row4: idea -> product
cell(3,0,'Задумай<br>ідею','c1');cell(3,1,'<span class="big">→</span>','c2');cell(3,2,'Ми зробимо<br>продукт','c3');
document.getElementById('tile').innerHTML=logoSVG(130,false);
document.querySelector('#b1 .t').innerHTML=logoSVG(130,false);
// extra project cells (swap)
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const tl=gsap.timeline({paused:true,defaults:{ease:'power4.out'}});
const up=(sel,at,d=.55,st=.07)=>tl.fromTo(sel,{yPercent:110},{yPercent:0,duration:d,stagger:st},at);
const dn=(sel,at,d=.3,st=.04)=>tl.to(sel,{yPercent:-110,duration:d,stagger:st,ease:'power3.in'},at);
tl.to('.h',{scaleX:1,duration:.7,stagger:.08,ease:'power3.inOut'},.1).to('.v',{scaleY:1,duration:.7,stagger:.1,ease:'power3.inOut'},.2);
up('#a1 .t,#a2 .t,#a3 .t',1.0,.6,.15);
// tile slides across row 3 and leaves content behind
tl.fromTo('#tile',{x:0},{x:1440,duration:1.5,ease:'power2.inOut'},2.0);
tl.set('#b1 .t,#b2 .t,#b3 .t',{yPercent:110},0);
tl.to('#b1 .t',{yPercent:0,duration:.01},2.55).to('#b2 .t',{yPercent:0,duration:.01},2.95).to('#b3 .t',{yPercent:0,duration:.01},3.35);
tl.fromTo('#b1 svg',{scale:.2,rotate:-90},{scale:1,rotate:0,duration:.6,ease:'back.out(2)'},2.55);
tl.fromTo('#b2 .t',{scale:.2},{scale:1,duration:.5,ease:'back.out(2)'},2.95);
tl.fromTo('#b3 .t',{scale:.9,opacity:0},{scale:1,opacity:1,duration:.5},3.35);
// row 4 reveal
up('#c1 .t,#c2 .t,#c3 .t',3.9,.6,.15);
// project cycle in b3
const projs=['FuturaHub','CashBank','Quinset','BPP'];
projs.forEach((p,i)=>{const a=5.3+i*.9;
  tl.to('#b3 .t',{yPercent:-110,duration:.25,ease:'power3.in'},a-.3).set('#b3 .t',{innerHTML:p,yPercent:110},a-.05).to('#b3 .t',{yPercent:0,duration:.45},a-.04);
});
// green->dark flip of row 2 into CTA
const T=9.2;
tl.to('#a1 .t,#a2 .t,#a3 .t,#c1 .t,#c2 .t,#c3 .t',{yPercent:-110,duration:.3,stagger:.03,ease:'power3.in'},T);
tl.set('#a1 .t',{innerHTML:'Пиши'},T+.4).set('#a2 .t',{innerHTML:'нам'},T+.4).set('#a3 .t',{innerHTML:'<span class="big">→</span>'},T+.4);
tl.set('#c1 .t',{innerHTML:'<span style="font-size:40px">Підписуйся</span>'},T+.4).set('#c2 .t',{innerHTML:'<span style="font-size:44px">@swipex.ua</span>'},T+.4).set('#c3 .t',{innerHTML:'<span class="mail" style="font-size:44px">hello@<br>swipex.ua</span>'},T+.4);
tl.set('#a1 .t,#a2 .t,#a3 .t,#c1 .t,#c2 .t,#c3 .t',{yPercent:110},T+.39);
tl.to('#a1 .t,#a2 .t,#a3 .t,#c1 .t,#c2 .t,#c3 .t',{yPercent:0,duration:.55,stagger:.07},T+.45);
tl.to('#c2',{backgroundColor:'#0B0B0B',color:'#0ABB87',duration:.4},T+1.2);
tl.to('#b2 .t',{rotate:180,duration:.6},T+.8);
tl.to({},{duration:.01},T+3.9);
window.TL=tl;
</script></body></html>
