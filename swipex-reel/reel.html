<!doctype html><meta charset="utf-8">
<style>
/* Кольори бренду Swipex. Шрифт — тимчасовий (Inter Black), справжній шрифт бренду не надано. */
:root{--accent:#0ABB87;--dark:#1E1E2D;--light:#F5F5F5;--font:'Inter Display','Inter',sans-serif}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:var(--font);font-weight:900}
#bg{position:absolute;inset:0}
.c{position:absolute;left:0;right:0;text-align:center;line-height:1;display:none}
#line{position:absolute;left:540px;top:0;width:6px;margin-left:-3px;display:none}
#dot{position:absolute;width:44px;height:44px;border-radius:50%;margin:-22px 0 0 -22px;display:none}
#stack{position:absolute;left:0;right:0;top:0;display:none}
#stack div{height:150px;line-height:150px;font-size:150px;text-align:center;color:var(--light);letter-spacing:-4px}
#stack .o{display:inline-block}
</style>
<div id="bg"></div><div id="line"></div><div id="dot"></div>
<div id="t1" class="c" style="font-size:230px;color:var(--light);letter-spacing:-6px"></div>
<div id="t2" class="c" style="top:760px;font-size:140px;letter-spacing:-5px"></div>
<div id="w" class="c" style="top:880px;font-size:160px;color:var(--light);letter-spacing:-5px"></div>
<div id="stack"></div>
<div id="logo" class="c" style="top:700px"><svg width="300" viewBox="0 0 65 61" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto"><path d="M63.3284 10.5327C65.5298 12.6545 65.5706 16.1122 63.3691 18.2339L54.074 27.271C51.8725 29.3928 48.2849 29.4321 46.0834 27.3103L36.7067 18.3518C36.7067 18.3518 36.666 18.3518 36.666 18.3125C34.1383 16.1907 30.8361 16.23 28.3085 18.3911L19.0541 27.3889C16.8526 29.5107 13.265 29.5499 11.0635 27.4282L1.68682 18.4697C-0.555432 16.3479 -0.555432 12.8902 1.64605 10.7685L11.0377 1.59131C13.2392 -0.530441 16.5628 -0.530436 18.805 1.59132L28.3492 10.6506C31.0807 12.9295 33.323 13.0867 36.7067 10.6506L46.0019 1.6135C48.2034 -0.508252 51.791 -0.547544 54.0332 1.57421L63.3284 10.5327Z" fill="#1E1E2D"/><path d="M61.4208 50.3074L52.4204 59.3822C50.2887 61.5128 46.8148 61.5522 44.6831 59.4216L35.6037 50.4258C33.472 48.2952 33.472 44.8231 35.5643 42.6926L44.5647 33.6178C46.6964 31.4872 50.1703 31.4478 52.302 33.5784L61.3814 42.5742C63.513 44.6653 63.5525 48.1769 61.4208 50.3074Z" fill="#0ABB87"/></svg><div style="font-size:190px;letter-spacing:-7px;color:var(--dark);margin-top:50px">Swipex</div></div>
<script>
const $=id=>document.getElementById(id);
const words=["а хтось","думав","над кожним","рухом"];
const st=$('stack');for(let i=0;i<9;i++){const d=document.createElement('div');d.innerHTML='К<span class="o">О</span>МАНДА';st.appendChild(d)}
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const O=[...st.querySelectorAll('.o')];
function pend(x,y,col){const d=$('dot'),l=$('line');d.style.display=l.style.display='block';
 d.style.background=l.style.background=col;d.style.left=x+'px';d.style.top=y+'px';l.style.left=x+'px';l.style.height=y+'px'}
function render(t){
 for(const id of['t1','t2','w','logo','dot','line'])$(id).style.display='none';
 st.style.display='none';st.style.filter='none';
 let bg='var(--accent)';
 const D='var(--dark)';
 if(t<1.2){ // хук
  const el=$('t1');el.style.display='block';el.style.top='540px';
  const flick=t<0.2&&Math.floor(t*30)%2==0;
  el.style.opacity=flick?0.35:1;
  el.innerHTML='СТОП<br>СТОП<br>СТОП';
  pend(540,520+ease(t/0.6)*210,D)}
 else if(t<2.8){ // два рядки
  const el=$('t2');el.style.display='block';
  el.innerHTML='<span style="color:var(--light)">ти свайпаєш</span><br><span style="color:'+D+'">не дивлячись</span>';
  el.style.transform='scale('+(0.92+0.08*ease((t-1.2)/0.25))+')';
  pend(540,700+Math.sin((t-1.2)*4)*5,D)}
 else if(t<4.8){ // швидкі слова
  bg=D;const i=Math.min(3,Math.floor((t-2.8)/0.5)),k=((t-2.8)%0.5)/0.5;
  const el=$('w');el.style.display='block';el.textContent=words[i];
  el.style.transform='scale('+(0.94+0.06*ease(k/0.25))+')'}
 else if(t<6.6){ // стопка «РОБОТА»
  bg=D;st.style.display='block';st.style.top=(960-75-4*150)+'px';st.style.transform='none';
  O.forEach((o,i)=>{o.style.color='var(--light)';o.style.transform='none'});
  const R=O[4].getBoundingClientRect(),ox=R.left+R.width/2,oy=R.top+R.height/2;
  const k=clamp((t-5.1)/0.8);
  if(k<1&&t>5.1)pend(ox,-20+(oy+20)*ease(k),'var(--light)');
  else if(k>=1){const p=clamp((t-5.9)/0.25);O[4].style.color='var(--accent)';
   O[4].style.transform='scale('+(1+0.35*Math.sin(p*Math.PI))+')'}}
 else if(t<7.1){ // скрол-розмиття вгору
  const k=(t-6.6)/0.5;st.style.display='block';
  st.style.top=(960-75-4*150-ease(k)*1700)+'px';st.style.transform='none';
  st.style.filter='blur('+(Math.sin(clamp(k)*Math.PI)*26)+'px)';
  O.forEach(o=>{o.style.color='var(--light)';o.style.transform='none'});O[4].style.color='var(--accent)';
  bg=k>0.5?'var(--light)':D}
 else{ // лого
  bg='var(--light)';const k=ease((t-7.1)/0.5);
  const l=$('logo');l.style.display='block';l.style.transform='scale('+(0.6+0.4*k)+')';l.style.opacity=k;}
 $('bg').style.background=bg;
}
render(0);
</script>
