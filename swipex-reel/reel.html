<!doctype html><meta charset="utf-8">
<style>
/* ===== ПЛЕЙСХОЛДЕРИ БРЕНДУ — замінити на реальні кольори/шрифт/лого SwipeX ===== */
:root{--accent:#14B85A;--dark:#0B0B0F;--light:#fff;--font:'Inter Display','Inter',sans-serif}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:var(--font);font-weight:900}
#bg{position:absolute;inset:0}
.c{position:absolute;left:0;right:0;text-align:center;line-height:1;display:none}
#line{position:absolute;left:540px;top:0;width:6px;margin-left:-3px;display:none}
#dot{position:absolute;width:44px;height:44px;border-radius:50%;margin:-22px 0 0 -22px;display:none}
#stack{position:absolute;left:0;right:0;top:0;display:none}
#stack div{height:150px;line-height:150px;font-size:150px;text-align:center;color:#fff;letter-spacing:-4px}
#stack .o{display:inline-block}
</style>
<div id="bg"></div><div id="line"></div><div id="dot"></div>
<div id="t1" class="c" style="font-size:230px;color:#fff;letter-spacing:-6px"></div>
<div id="t2" class="c" style="top:760px;font-size:150px;letter-spacing:-5px"></div>
<div id="w" class="c" style="top:880px;font-size:170px;color:#fff;letter-spacing:-5px"></div>
<div id="stack"></div>
<div id="logo" class="c" style="top:760px;font-size:210px;color:var(--dark);letter-spacing:-8px">SwipeX</div>
<div id="sub" class="c" style="top:1030px;font-size:50px;font-weight:700;color:var(--dark)">digital-продукти · дизайн · розробка</div>
<script>
const $=id=>document.getElementById(id);
const words=["за кожним","свайпом","стоїть","чиясь"];
const st=$('stack');for(let i=0;i<9;i++){const d=document.createElement('div');d.innerHTML='Р<span class="o">О</span>БОТА';st.appendChild(d)}
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const O=[...st.querySelectorAll('.o')];
function pend(x,y,col){const d=$('dot'),l=$('line');d.style.display=l.style.display='block';
 d.style.background=l.style.background=col;d.style.left=x+'px';d.style.top=y+'px';l.style.left=x+'px';l.style.height=y+'px'}
function render(t){
 for(const id of['t1','t2','w','logo','sub','dot','line'])$(id).style.display='none';
 st.style.display='none';st.style.filter='none';
 let bg='var(--accent)';
 const D='var(--dark)';
 if(t<1.2){ // хук
  const el=$('t1');el.style.display='block';el.style.top='540px';
  const flick=t<0.2&&Math.floor(t*30)%2==0;
  el.style.opacity=flick?0.35:1;
  el.innerHTML='СВАЙП<br>СВАЙП<br>СВАЙП';
  pend(540,520+ease(t/0.6)*210,D)}
 else if(t<2.8){ // два рядки
  const el=$('t2');el.style.display='block';
  el.innerHTML='<span style="color:#fff">ти робиш це</span><br><span style="color:'+D+'">щодня</span>';
  el.style.transform='scale('+(0.92+0.08*ease((t-1.2)/0.25))+')';
  pend(540,700+Math.sin((t-1.2)*4)*5,D)}
 else if(t<4.8){ // швидкі слова
  bg=D;const i=Math.min(3,Math.floor((t-2.8)/0.5)),k=((t-2.8)%0.5)/0.5;
  const el=$('w');el.style.display='block';el.textContent=words[i];
  el.style.transform='scale('+(0.94+0.06*ease(k/0.25))+')'}
 else if(t<6.6){ // стопка «РОБОТА»
  bg=D;st.style.display='block';st.style.top=(960-75-4*150)+'px';st.style.transform='none';
  O.forEach((o,i)=>{o.style.color='#fff';o.style.transform='none'});
  const R=O[4].getBoundingClientRect(),ox=R.left+R.width/2,oy=R.top+R.height/2;
  const k=clamp((t-5.1)/0.8);
  if(k<1&&t>5.1)pend(ox,-20+(oy+20)*ease(k),'#fff');
  else if(k>=1){const p=clamp((t-5.9)/0.25);O[4].style.color='var(--accent)';
   O[4].style.transform='scale('+(1+0.35*Math.sin(p*Math.PI))+')'}}
 else if(t<7.1){ // скрол-розмиття вгору
  const k=(t-6.6)/0.5;st.style.display='block';
  st.style.top=(960-75-4*150-ease(k)*1700)+'px';st.style.transform='none';
  st.style.filter='blur('+(Math.sin(clamp(k)*Math.PI)*26)+'px)';
  O.forEach(o=>{o.style.color='#fff';o.style.transform='none'});O[4].style.color='var(--accent)';
  bg=k>0.5?'var(--accent)':D}
 else{ // лого
  const k=ease((t-7.1)/0.5);
  const l=$('logo');l.style.display='block';l.style.transform='scale('+(0.6+0.4*k)+')';l.style.opacity=k;
  const s=$('sub');s.style.display='block';s.style.opacity=ease((t-7.5)/0.4)}
 $('bg').style.background=bg;
}
render(0);
</script>
