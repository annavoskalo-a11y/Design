<!doctype html><meta charset="utf-8">
<style>
/* Кольори бренду Swipex. Шрифт — тимчасовий (Inter Black), справжній шрифт бренду не надано. */
:root{--accent:#0ABB87;--dark:#1E1E2D;--light:#F5F5F5;--font:'Inter Display','Inter',sans-serif}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:var(--font);font-weight:900;position:relative;background:var(--accent)}
.L{position:absolute;inset:0}
#bgD{background:var(--dark);clip-path:circle(0px at 540px 720px)}
#bgL{background:var(--light);clip-path:circle(0px at 540px 960px)}
#grid{background-image:radial-gradient(rgba(245,245,245,.16) 2.5px,transparent 3px);background-size:72px 72px}
.ln{display:block;overflow:hidden;padding:.14em .12em;margin:-.14em -.12em;line-height:1;white-space:nowrap}
.ch{display:inline-block;will-change:transform}
.blk{position:absolute;left:0;right:0;text-align:center;display:none}
#feed{display:none;overflow:hidden;perspective:1700px}
#feedIn{position:absolute;left:-260px;top:-700px;width:1600px;height:3400px;transform:rotateX(52deg) rotateZ(-24deg) scale(1.15);transform-origin:50% 50%}
.card{position:absolute;width:560px;height:470px;border-radius:44px;background:rgba(30,30,45,.20);box-shadow:0 30px 60px rgba(30,30,45,.18)}
.card i{position:absolute;display:block;background:rgba(245,245,245,.22);border-radius:12px}
#line,#dot,.rip{position:absolute;display:none}
#line{width:6px;margin-left:-3px;top:0}
#dot{width:44px;height:44px;border-radius:50%;margin:-22px 0 0 -22px}
.rip{width:44px;height:44px;border-radius:50%;margin:-22px 0 0 -22px;border:5px solid}
#fx{position:absolute;left:0;top:0;display:none}
#stack{position:absolute;left:0;right:0;top:0;display:none}
#stack .row{height:150px;line-height:150px;font-size:150px;text-align:center;color:var(--light);letter-spacing:-4px}
#stack .o{display:inline-block}
.cur{position:absolute;display:none;width:0;height:0;transform-origin:0 0;transform:scale(1.9)}
.cur svg{position:absolute;left:0;top:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.cur b{position:absolute;left:30px;top:34px;width:62px;height:30px;border-radius:15px}
.cur b:after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85)}
</style>
<div id="bgG" class="L"></div><div id="bgD" class="L"></div><div id="bgL" class="L"></div><div id="grid" class="L"></div>
<div id="feed" class="L"><div id="feedIn"></div></div>
<div id="t1" class="blk" style="top:540px;font-size:230px;color:var(--light);letter-spacing:-6px"></div>
<div id="t2" class="blk" style="top:760px;font-size:140px;letter-spacing:-5px"></div>
<svg id="fx" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
 <g id="g0" style="display:none"></g>
 <g id="g1" style="display:none">
  <path id="bz" d="M120 1120 C300 740 780 1180 960 800" pathLength="1" stroke="#0ABB87" stroke-width="6" stroke-dasharray="1" stroke-dashoffset="1"/>
  <g id="bzH" stroke="#F5F5F5" stroke-width="3" opacity=".7"><path d="M120 1120 L300 740 M960 800 L780 1180"/><circle cx="300" cy="740" r="11" fill="#1E1E2D"/><circle cx="780" cy="1180" r="11" fill="#1E1E2D"/></g>
  <g fill="#F5F5F5" stroke="#0ABB87" stroke-width="4"><rect x="100" y="1100" width="40" height="40"/><rect x="940" y="780" width="40" height="40"/></g>
 </g>
 <g id="g2" style="display:none">
  <g stroke="#0ABB87" stroke-width="2" opacity=".6"><path d="M0 860H1080M0 1060H1080M40 0V1920M1040 0V1920"/></g>
  <rect id="sel" x="40" y="860" width="1000" height="200" stroke="#0ABB87" stroke-width="5"/>
  <g id="selH" fill="#F5F5F5" stroke="#0ABB87" stroke-width="4"></g>
 </g>
 <g id="g3" style="display:none">
  <rect x="330" y="1180" width="420" height="420" rx="40" stroke="#F5F5F5" stroke-opacity=".3" stroke-width="3"/>
  <path d="M330 1600H750M330 1180V1600" stroke="#F5F5F5" stroke-opacity=".15" stroke-width="2"/>
  <path id="ez" d="M350 1580 C 560 1580, 520 1200, 730 1200" pathLength="1" stroke="#0ABB87" stroke-width="8" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/>
  <circle id="ezd" r="20" fill="#F5F5F5"/>
 </g>
</svg>
<div id="w0" class="blk" style="top:880px;font-size:160px;color:var(--light);letter-spacing:-5px"></div>
<div id="w1" class="blk" style="top:880px;font-size:160px;color:var(--light);letter-spacing:-5px"></div>
<div id="w2" class="blk" style="top:880px;font-size:160px;color:var(--light);letter-spacing:-5px"></div>
<div id="w3" class="blk" style="top:880px;font-size:160px;color:var(--light);letter-spacing:-5px"></div>
<div id="stack"></div>
<div id="line"></div><div id="dot"></div><div class="rip" id="r1"></div><div class="rip" id="r2"></div>
<div id="logo" class="blk" style="top:700px"><svg width="300" viewBox="0 0 65 61" fill="none" style="display:block;margin:0 auto;overflow:visible"><path id="lt" d="M63.3284 10.5327C65.5298 12.6545 65.5706 16.1122 63.3691 18.2339L54.074 27.271C51.8725 29.3928 48.2849 29.4321 46.0834 27.3103L36.7067 18.3518C36.7067 18.3518 36.666 18.3518 36.666 18.3125C34.1383 16.1907 30.8361 16.23 28.3085 18.3911L19.0541 27.3889C16.8526 29.5107 13.265 29.5499 11.0635 27.4282L1.68682 18.4697C-0.555432 16.3479 -0.555432 12.8902 1.64605 10.7685L11.0377 1.59131C13.2392 -0.530441 16.5628 -0.530436 18.805 1.59132L28.3492 10.6506C31.0807 12.9295 33.323 13.0867 36.7067 10.6506L46.0019 1.6135C48.2034 -0.508252 51.791 -0.547544 54.0332 1.57421L63.3284 10.5327Z" fill="#1E1E2D"/><path id="lb" d="M61.4208 50.3074L52.4204 59.3822C50.2887 61.5128 46.8148 61.5522 44.6831 59.4216L35.6037 50.4258C33.472 48.2952 33.472 44.8231 35.5643 42.6926L44.5647 33.6178C46.6964 31.4872 50.1703 31.4478 52.302 33.5784L61.3814 42.5742C63.513 44.6653 63.5525 48.1769 61.4208 50.3074Z" fill="#0ABB87"/></svg><div id="lw" style="font-size:190px;letter-spacing:-7px;color:var(--dark);margin-top:50px"></div></div>
<script>
const $=id=>document.getElementById(id);
const clamp=x=>Math.min(1,Math.max(0,x)),expo=x=>{x=clamp(x);return x>=1?1:1-Math.pow(2,-10*x)},eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back=x=>{x=clamp(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const D='#1E1E2D',L='#F5F5F5',A='#0ABB87';
function mk(id,lines){const root=$(id);root.innerHTML='';return lines.map(([txt,col])=>{const ln=document.createElement('div');ln.className='ln';if(col)ln.style.color=col;[...txt].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch==' '?' ':ch;ln.appendChild(s)});root.appendChild(ln);return ln})}
function chars(ln,tin,tout,t,dur=.55,stag=.03){const cs=ln.children;for(let i=0;i<cs.length;i++){const p=expo((t-tin-i*stag)/dur),q=eio((t-tout-i*stag)/(dur*.7));cs[i].style.transform='translateY('+((1-p)*118-q*118)+'%)'}}
const T1=mk('t1',[['СТОП'],['СТОП'],['СТОП']]);
const T2=mk('t2',[['ти свайпаєш',L],['не дивлячись',D]]);
const WORDS=["а хтось","думав","над кожним","рухом"];const W=WORDS.map((w,i)=>mk('w'+i,[[w]])[0]);
const LW=mk('lw',[['Swipex']])[0];
const fin=$('feedIn');const cards=[];for(let c=0;c<2;c++)for(let i=0;i<7;i++){const e=document.createElement('div');e.className='card';e.innerHTML='<i style="left:36px;top:36px;width:72px;height:72px;border-radius:50%"></i><i style="left:128px;top:44px;width:230px;height:20px"></i><i style="left:128px;top:80px;width:150px;height:16px"></i><i style="left:36px;top:140px;width:488px;height:240px;border-radius:28px"></i><i style="left:36px;top:404px;width:330px;height:18px"></i>';fin.appendChild(e);cards.push([e,c,i])}
const st=$('stack');const ROWS=[];for(let i=0;i<9;i++){const d=document.createElement('div');d.className='row';d.innerHTML='К<span class="o">О</span>МАНДА';st.appendChild(d);ROWS.push(d)}
const O=ROWS.map(r=>r.querySelector('.o'));
const curSVG=c=>`<svg width="44" height="56" viewBox="0 0 24 34"><path d="M1 1 V28 L8 21 L13 33 L18 31 L13 19 L23 19 Z" fill="${c}" stroke="#1E1E2D" stroke-width="2" stroke-linejoin="round"/></svg>`;
const mkCur=(c,p)=>{const e=document.createElement('i');e.className='cur';e.innerHTML=curSVG(c)+'<b style="background:'+p+'"></b>';return e};
const curs=[mkCur(A,A),mkCur(L,L),mkCur(A,A)];curs.forEach(e=>st.appendChild(e));
const c0=mkCur(A,A);document.body.appendChild(c0);
const sh=$('selH');[[40,860],[540,860],[1040,860],[40,960],[1040,960],[40,1060],[540,1060],[1040,1060]].forEach(([x,y])=>sh.insertAdjacentHTML('beforeend','<rect x="'+(x-12)+'" y="'+(y-12)+'" width="24" height="24"/>'));
function rowBox(row){const r=document.createRange();r.selectNodeContents(ROWS[row]);return r.getBoundingClientRect()}
function pend(x,y,col){const d=$('dot'),l=$('line');d.style.display=l.style.display='block';d.style.background=l.style.background=col;d.style.left=x+'px';d.style.top=y+'px';l.style.left=x+'px';l.style.height=Math.max(0,y)+'px'}
function ripple(id,x,y,t0,t,col,dur=.9){const r=$(id),k=(t-t0)/dur;if(k<0||k>1){r.style.display='none';return}r.style.display='block';r.style.left=x+'px';r.style.top=y+'px';r.style.borderColor=col;r.style.opacity=.9*(1-k);r.style.transform='scale('+(1+expo(k)*5)+')'}
function draw(t){
 const hide=ids=>ids.forEach(i=>$(i).style.display='none');
 hide(['t1','t2','w0','w1','w2','w3','logo','dot','line','r1','r2','feed','fx','stack']);
 ['g0','g1','g2','g3'].forEach(g=>$(g).style.display='none');c0.style.display='none';curs.forEach(e=>e.style.display='none');
 $('bgD').style.clipPath='circle('+(eio((t-2.5)/0.7)*2300)+'px at 540px 720px)';
 $('bgL').style.clipPath='circle('+(eio((t-6.85)/0.65)*2300)+'px at 540px 960px)';
 $('grid').style.backgroundPosition='0 '+(-t*36)+'px';$('grid').style.opacity=(1-eio((t-6.9)/0.4))*(t<2.6?0.55:1);
 if(t<1.3){const el=$('t1');el.style.display='block';
  T1.forEach((ln,i)=>chars(ln,0.05+i*0.1,1.0+i*0.05,t));
  el.style.transform='scale('+(1+0.05*eio(t/1.2))+')'}
 if(t>=1.1&&t<2.95){const el=$('t2');el.style.display='block';
  chars(T2[0],1.15,2.5,t);chars(T2[1],1.27,2.58,t);
  const f=$('feed');f.style.display='block';f.style.opacity=eio((t-1.15)/0.5)*(1-eio((t-2.6)/0.3))*0.9;
  const sc=(t-1.1)*520;cards.forEach(([e,c,i])=>{const per=7*500;let y=(((i*500-sc*(c?1.35:1)+c*250)%per)+per)%per-500;e.style.left=(180+c*680)+'px';e.style.top=(y+400)+'px'})}
 if(t<1.1){pend(540,520+eio(t/0.8)*210,D);ripple('r1',540,730,0.8,t,D);ripple('r2',540,730,0.98,t,D)}
 else if(t<2.5){pend(540+Math.sin((t-1.1)*3)*4,722+Math.sin((t-1.1)*4)*4,D)}
 else if(t<3.35){const c=eio((t-2.5)/0.2);const col=c<.5?D:L;const y=722-eio((t-2.9)/0.45)*820;pend(540,y,col);ripple('r1',540,722,2.5,t,L,.7)}
 if(t>=2.75&&t<4.85){
  const i=Math.max(0,Math.min(3,Math.floor((t-2.8)/0.5))),a=2.8+i*0.5,k=(t-a)/0.5;
  W.forEach((ln,j)=>{if(j==i){$('w'+j).style.display='block';chars(ln,a,a+(i==3?1.9:0.36),t,0.34,0.022)}});
  const env=Math.min(expo((t-a)/0.16),i==3?expo((4.85-t)/0.2):1-expo((k-0.72)/0.18));
  $('fx').style.display='block';$('fx').style.opacity=env;$('g'+i).style.display='block';
  if(i==0){c0.style.display='block';c0.style.opacity=env;const p=eio(k/0.9);c0.style.left=(960-300*p)+'px';c0.style.top=(1350-340*p)+'px'}
  if(i==1){$('bz').setAttribute('stroke-dashoffset',1-expo(k/0.75));$('bzH').style.opacity=clamp((k-0.65)/0.25)*0.8}
  if(i==2){const p=expo(k/0.55);$('sel').setAttribute('x',40+500*(1-p));$('sel').setAttribute('width',1000*p);sh.style.opacity=clamp((k-.45)/.25)}
  if(i==3){$('ez').setAttribute('stroke-dashoffset',1-expo(k/0.85));const pa=$('ez'),Ln=pa.getTotalLength(),pt=pa.getPointAtLength(Ln*eio(k/0.95));const d=$('ezd');d.setAttribute('cx',pt.x);d.setAttribute('cy',pt.y);d.style.opacity=clamp(k/0.1)}}
 if(t>=4.7&&t<7.4){st.style.display='block';
  const k2=clamp((t-6.6)/0.65);
  st.style.top=(960-75-4*150-eio(k2)*1750)+'px';
  st.style.filter=t>6.6?'blur('+(Math.sin(k2*Math.PI)*14)+'px)':'none';
  st.style.opacity=1-eio((t-6.95)/0.35);
  ROWS.forEach((r,i)=>{const p=expo((t-4.75-i*0.045)/0.65);const wave=Math.sin(t*2.4+i*0.7)*12*p;r.style.transform='translateX('+((i%2?1:-1)*(1-p)*320+wave)+'px)';r.style.opacity=clamp(p*1.6)});
  O.forEach(o=>{o.style.color=L;o.style.transform='none'});
  const sr=st.getBoundingClientRect();
  const R=O[4].getBoundingClientRect(),ox=R.left+R.width/2,oy=R.top+R.height/2;
  const k=clamp((t-5.2)/1.0);
  if(t>5.2&&k<1&&t<6.6)pend(ox,-20+(oy+20)*eio(k),L);
  const lit=t>=6.2;if(lit){const p=clamp((t-6.2)/0.45);O[4].style.color=A;O[4].style.transform='scale('+(1+0.3*Math.sin(p*Math.PI))+')'}
  const tg=[[1,'right',-300,-200,6.3],[7,'left',1400,1500,6.4],[2,'right',1400,300,6.5]];
  tg.forEach(([row,side,sx,sy,t0],j)=>{const rr=rowBox(row);const rx=(side=='right'?rr.right-90:rr.left+30)-sr.left,ry=row*150+85;const p=eio((t-t0)/0.55),bob=Math.sin(t*9+j)*4;const e=curs[j];e.style.display=t>t0?'block':'none';e.style.left=(sx+(rx-sx)*p)+'px';e.style.top=(sy+(ry-sy)*p+bob)+'px'})}
 if(t>=7.15){const T=t-7.2;const l=$('logo');l.style.display='block';
  const a=expo(T/0.9),b=back((T-0.25)/0.8);
  $('lt').setAttribute('transform','translate('+(-130*(1-a))+' 0)');$('lt').style.opacity=clamp(T/0.25);
  $('lb').setAttribute('transform','translate(0 '+(-95*(1-b))+')');$('lb').style.opacity=clamp((T-0.25)/0.2);
  chars(LW,7.2+0.6,99,t,0.7,0.05);
  l.style.transform='scale('+(0.94+0.06*eio(T/1.9))+')';
  ripple('r1',540,700+282*0.75,7.2+0.9,t,A,.9)}
}
const SP=1.25;function render(T){draw(T/SP)}
render(0);
</script>
